name: PR checks

# Automated checks for pull requests: type-checking (main, preload, shared,
# renderer) and the unit test suite. Native modules aren't needed for either,
# so dependencies install with --ignore-scripts to keep the job fast.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run
