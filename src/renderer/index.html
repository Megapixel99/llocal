<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <!-- Render at the device's real width on mobile (Capacitor/WKWebView) instead of a scaled-down
       ~980px desktop width; viewport-fit=cover lets the UI extend under the notch / home indicator.
       Harmless on desktop Electron. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->

    <!-- <script src="https://unpkg.com/react-scan/dist/auto.global.js"></script> -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';  connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; media-src blob:; frame-src 'self'" />
</head>

<body class="">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
